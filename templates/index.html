<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoVision AI - Waste Classification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f5132, #198754);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #0f5132;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #198754;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #e9f7ef;
            text-align: center;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            color: #0f5132;
            margin: 10px;
        }

        .confidence {
            font-size: 18px;
            color: #444;
        }

        #loading {
            display: none;
            text-align: center;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>♻️ EcoVision AI</h1>

    <p class="subtitle">
        Waste Classification using CNN
    </p>

    <div class="upload-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <img id="preview">

    </div>

    <button onclick="classifyImage()">
        Classify Waste
    </button>

    <div id="loading">
        🔄 Processing image...
    </div>

    <div id="result">

        <h2>Prediction</h2>

        <div
            id="prediction"
            class="prediction">
        </div>

        <div
            id="confidence"
            class="confidence">
        </div>

    </div>

</div>

<script>

const imageInput = document.getElementById("imageInput");

imageInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const preview =
        document.getElementById("preview");

    preview.src =
        URL.createObjectURL(file);

    preview.style.display = "block";
});


async function classifyImage() {

    const file =
        imageInput.files[0];

    if (!file) {

        alert("Please select an image.");

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "image",
        file
    );

    document.getElementById(
        "loading"
    ).style.display = "block";

    document.getElementById(
        "result"
    ).style.display = "none";

    try {

        const response =
            await fetch(
                "/predict",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Prediction failed"
            );
        }

        document.getElementById(
            "prediction"
        ).innerText =
            data.prediction.toUpperCase();

        document.getElementById(
            "confidence"
        ).innerText =
            "Confidence: " +
            data.confidence +
            "%";

        document.getElementById(
            "result"
        ).style.display = "block";

    } catch (error) {

        alert(
            "Error: " +
            error.message
        );

    } finally {

        document.getElementById(
            "loading"
        ).style.display = "none";
    }
}

</script>

</body>

</html>
